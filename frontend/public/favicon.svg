<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="stGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7C3AED" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Ticket Body with subtle notch cutouts -->
  <path d="M12 8 C8 8 6 10 6 14 V26 C9 26 11 28.5 11 32 C11 35.5 9 38 6 38 V50 C6 54 8 56 12 56 H52 C56 56 58 54 58 50 V38 C55 38 53 35.5 53 32 C53 28.5 55 26 58 26 V14 C58 10 56 8 52 8 Z" 
        fill="url(#stGrad)" filter="url(#softGlow)" />

  <!-- Ticket perforated divider line -->
  <line x1="22" y1="12" x2="22" y2="52" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2.5 2.5" />

  <!-- Minimal Integrated 'ST' Monogram -->
  <!-- 'S' Path -->
  <path d="M38 21 C33 21 31 23.5 31 26.5 C31 31 41 30.5 41 35 C41 38.5 38 41 33 41 C29.5 41 27.5 39 27 37" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- 'T' Path (Integrated Over/Through 'S') -->
  <path d="M42 21 H52 M47 21 V41" 
        stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
