<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Enterprise Tech Blue Gradient matching website #1D4ED8 -> #2563EB -> #38BDF8 -->
    <linearGradient id="brandBlue" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Subtle Cyan Accent Gradient for the Workflow Spark -->
    <linearGradient id="accentCyan" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#1E3A8A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Enterprise Ticket Badge Container with Corner Geometry -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#brandBlue)" filter="url(#badgeShadow)" />

  <!-- Inner Subtle Border Accent -->
  <rect x="7" y="7" width="50" height="50" rx="13" stroke="#93C5FD" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Digital Perforation Notch Indicator on Left & Right Edge -->
  <path d="M6 32 C9.5 32 11.5 29.5 11.5 26.5 H6 Z" fill="#0F172A" />
  <path d="M6 32 C9.5 32 11.5 34.5 11.5 37.5 H6 Z" fill="#0F172A" />
  <path d="M58 32 C54.5 32 52.5 29.5 52.5 26.5 H58 Z" fill="#0F172A" />
  <path d="M58 32 C54.5 32 52.5 34.5 52.5 37.5 H58 Z" fill="#0F172A" />

  <!-- Left Automation Spark Node -->
  <circle cx="19" cy="32" r="2.5" fill="#93C5FD" opacity="0.8" />

  <!-- Monogram S Path (Precision Vector) -->
  <path d="M33.5 22 C29 22 26 24.2 26 27.5 C26 32 35 31.5 35 36.5 C35 40 31.8 42 27.5 42 C24.2 42 22 40 21.5 38" 
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram T Path (Clean Geometric Alignment) -->
  <path d="M37.5 22 H48.5 M43 22 V42" 
        stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Top-Right Workflow Automation Node -->
  <circle cx="48" cy="16" r="3" fill="url(#accentCyan)" />
  <circle cx="48" cy="16" r="1.2" fill="#FFFFFF" />
</svg>
