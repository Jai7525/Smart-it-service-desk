[project]
name = "smart-ticket"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jai7525", email = "jayakumar312006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.1",
    "pytest>=8.3.4",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.22",
    "supabase>=2.11.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
smart-ticket = "smart_ticket:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

